<!DOCTYPE html> 
<html lang="en"> 
 
<head> 
  <meta charset="UTF-8"> 
  <meta http-equiv="X-UA-Compatible" content="IE=edge"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>CRUD</title> 
  <link rel="stylesheet" href="css/login.css"> 
  <link href='https://unpkg.com/boxicons@2.1.1/css/boxicons.min.css' 
rel='stylesheet'> 
</head> 
 
<body> 
  <div class="container"> 
    <div class="header"> 
      <span>Login</span> 

      <div class="buttons">
          <button onclick="openLogin()" id="new">Fazer login</button>
          <button onclick="openCadastro()" id="new2">Cadastrar</button>
      </div>

    </div> 
 
<div class="divTable">

    <div class="register">
        <p id="title">
            Realize o cadastro com alta tecnologia e segurança ao alcance de todos
        </p>

        <button onclick="openCadastro()" id="new3">
            Cadastrar
        </button>
    </div>

    <div class="image-container">
        <img src="img/emoji-4827091_640.png" alt="Login">
    </div>

</div>
 
    <div class="modal-container"> 
      <div class="modal"> 
        <form> 
         <h2 id="modalTitle">Login</h2>

        <label for="m-email">Email</label>
        <input id="m-email" type="email" required />

        <label for="m-senha">Senha</label>
        <input id="m-senha" type="password" required />

        <button id="btnSalvar">Entrar</button>
        </form> 
      </div> 
    </div> 
 
  </div> 
  <script src="login.js"></script> 
</body> 
 
</html>
